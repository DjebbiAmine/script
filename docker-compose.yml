version: "3.8"

services:

  script:
    image: synergy-call-center:latest
    container_name: synergy-call-center
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PORT: 3000
    expose:
      - "3000"
    networks:
      - sy-network



networks:
  sy-network:
    name: sy-network
